<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seliq Extensions</title>
<meta name="description" content="Extension store for Seliq — hundreds of PopClip-compatible extensions, one click away.">
<link rel="icon" type="image/svg+xml" href="seliq-icon.svg">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-arabic@5/wght.css">
<link rel="stylesheet" href="store.css?v=__V__">
</head>
<body data-mode="light">
<div id="bg" aria-hidden="true"></div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="./">
      <img src="seliq-icon.svg" alt="" width="26" height="26">
      <span>Seliq Extensions</span>
    </a>
    <div class="nav-actions">
      <a class="nav-link" id="site-link" href="https://seliq.kr/" data-i18n="site">Seliq website</a>
      <button class="icon-btn" id="mode-toggle" type="button" aria-label="Toggle dark mode" data-i18n-title="modeToggle" title="Toggle dark mode">
        <svg class="ic-moon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/></svg>
        <svg class="ic-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1"/></svg>
      </button>
      <select class="icon-btn lang-select" id="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="zh-Hans">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pt-BR">Português (Brasil)</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <h1 data-i18n="heroTitle">Find your next favorite.</h1>
    <p class="lead" id="hero-sub"></p>
    <label class="spotlight">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="10.6" y1="10.6" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="search" type="search" autocomplete="off" data-i18n-placeholder="searchPh" placeholder="Search by name, description or identifier" aria-label="Search">
    </label>
    <div class="chips" id="chips" role="tablist"></div>
    <div class="meta">
      <span class="count" id="count" aria-live="polite"></span>
      <label class="sort"><span data-i18n="sort">Sort</span>
        <select id="sort">
          <option value="asc" data-i18n="sortAsc">Name A–Z</option>
          <option value="desc" data-i18n="sortDesc">Name Z–A</option>
          <option value="size" data-i18n="sortSize">Smallest first</option>
        </select>
      </label>
    </div>
  </section>

  <section class="store">
    <div class="hint" id="hint" hidden>
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7.2V11M8 5v.1"/></svg>
      <span id="hint-text"></span>
      <button type="button" id="hint-x" aria-label="Dismiss">×</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="more" id="more"></p>
    <noscript><div class="fallback"><!--NOSCRIPT--></div></noscript>
  </section>
</main>

<footer class="footer">
  <p id="legal-popclip"></p>
  <p id="legal-contrib"></p>
  <p class="footer-links"><a href="index.json">index.json</a> · <a href="https://github.com/seliq-app" target="_blank" rel="noopener">GitHub</a></p>
</footer>

<script src="store.js?v=__V__"></script>
</body>
</html>
